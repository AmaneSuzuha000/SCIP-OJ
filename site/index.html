<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>scip-oj · L1 练习</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>scip-oj</h1>
    <p>GitHub Pages · L1 浏览器判分（练习，不作正式成绩）· 通过线 90 · 多实例平均分</p>
  </header>
  <main>
    <section id="problem-list"></section>
    <section id="workspace" hidden>
      <h2 id="title"></h2>
      <article id="readme"></article>
      <label for="code">你的 solve 实现（Python 子集 · MVP 用内置解释器跑背包 DP/提交）</label>
      <textarea id="code" rows="22" spellcheck="false"></textarea>
      <div class="actions">
        <button id="btn-grade" type="button">提交评分（L1）</button>
        <span id="status"></span>
      </div>
      <pre id="report"></pre>
    </section>
  </main>
  <footer>
    <p>骨架阶段：P001 在浏览器内用 JS 复现同一套性质验证规则。JupyterLite + PySCIPOpt 见 README Phase 0+。</p>
  </footer>
  <script src="js/knapsack_judge.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
