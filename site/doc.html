<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SCIP/LAB · 文档</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="ui-refresh.css" />
  <link rel="stylesheet" href="js/markdown.css?v=math1" />
  <style>
    .doc-container {
      max-width: 900px;
      margin: 1.5rem auto 3rem;
      padding: 0 1.25rem;
    }
    .doc-article {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      padding: 2rem 2.25rem;
      line-height: 1.7;
    }
    .doc-article h1, .doc-article h2, .doc-article h3 {
      color: var(--text-primary);
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
    }
    .doc-article h1:first-child {
      margin-top: 0;
    }
    .doc-article code {
      background: var(--bg-base);
      border: 1px solid var(--border-default);
      color: #f0883e;
      padding: 0.15em 0.4em;
      border-radius: var(--radius-sm);
      font-size: 0.9em;
    }
    .doc-article pre {
      background: var(--bg-base);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      padding: 1rem;
      overflow: auto;
    }
    .doc-article pre code {
      background: transparent;
      border: none;
      padding: 0;
      color: var(--text-primary);
    }
    .doc-article table {
      border-collapse: collapse;
      width: 100%;
      margin: 1rem 0;
    }
    .doc-article th, .doc-article td {
      border: 1px solid var(--border-default);
      padding: 0.6rem 0.85rem;
    }
    .doc-article th {
      background: var(--bg-subtle);
      color: var(--text-primary);
    }
    .doc-article blockquote {
      border-left: 4px solid var(--border-default);
      margin: 1rem 0;
      padding-left: 1rem;
      color: var(--text-secondary);
    }
  </style>
  <link rel="stylesheet" href="styles/shell.css?v=nav1">
</head>
<body class="document-page">
  <!-- PLATFORM_HEADER -->

  <main class="doc-container">
    <div style="margin-bottom:1rem;">
      <a href="index.html#course" class="btn-back" id="doc-back-link">← 返回课程教学</a>
    </div>
    <article id="md" class="doc-article">正在加载文档内容...</article>
  </main>

  <footer>
    <div class="footer-container">
      <div id="doc-platform-label"><strong>SCIP-OJ</strong> · 课程教学与作业评测</div>
      <div>Markdown · 数学公式</div>
    </div>
  </footer>

  <script src="js/marked.min.js"></script>
  <script src="js/purify.min.js"></script>
  <script src="js/markdown.js?v=math1"></script>
  <script>
    (async () => {
      const params = new URLSearchParams(location.search);
      const path = params.get("path") || ("docs/" + (params.get("f") || "学生指南.md"));
      const name = path.split("/").pop().replace(/\.md$/, "");
      const learning = params.get("space") === "learn";
      for (const [id, selected] of [['nav-course-space', !learning], ['nav-learning-space', learning]]) {
        const link = document.getElementById(id);
        link.classList.toggle('active', selected);
        if (selected) link.setAttribute('aria-current', 'page'); else link.removeAttribute('aria-current');
      }
      document.querySelector('.section-navigation').hidden = learning;
      const backLink = document.getElementById("doc-back-link");
      backLink.href = learning ? "index.html#learn" : "index.html#course";
      backLink.textContent = learning ? "← 返回拓展学习" : "← 返回课程教学";
      document.querySelector(".brand-logo").href = backLink.href;
      if (learning) document.getElementById("doc-platform-label").textContent = "SCIP/LAB · 拓展学习资源";
      document.title = "SCIP/LAB · " + name;
      const mdEl = document.getElementById("md");
      try {
        const r = await fetch(path);
        if (!r.ok) {
          mdEl.textContent = `文档加载失败: ${path} (HTTP ${r.status})`;
          mdEl.className = "fail";
          return;
        }
        const raw = await r.text();
        if (window.ScipOJMarkdown) window.ScipOJMarkdown.render(mdEl, raw);
        else mdEl.textContent = raw;
      } catch (e) {
        mdEl.textContent = "网络请求异常: " + e.message;
        mdEl.className = "fail";
      }
    })();
  </script>
</body>
</html>
