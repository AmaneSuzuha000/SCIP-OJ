name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build the course app
        env:
          # A project page is served from /<repo>/, so the bundle and the
          # injected config.js must be requested under that prefix.
          VITE_BASE: ${{ format('/{0}/', github.event.repository.name) }}
        # build also stages runtime/: Pyodide plus the numpy/scipy wheels.
        run: npm --prefix web ci && npm --prefix web run build

      - name: Assemble course site
        shell: bash
        env:
          SCIP_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SCIP_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # The React app is the site. JupyterLite is no longer shipped: the
          # lessons run on the in-page Pyodide kernel instead, so there is no
          # notebook server and no second frontend to keep in sync.
          python3 scripts/assemble_site.py --web-dist web/dist --output dist
          if [ -n "$SCIP_SUPABASE_URL" ] && [ -n "$SCIP_SUPABASE_ANON_KEY" ]; then
            python3 -c 'import json,os,pathlib; pathlib.Path("dist/config.js").write_text("window.SCIP_OJ_CONFIG = " + json.dumps({"SUPABASE_URL": os.environ["SCIP_SUPABASE_URL"], "SUPABASE_ANON_KEY": os.environ["SCIP_SUPABASE_ANON_KEY"], "MOCK_MODE": False}, indent=2) + ";\n")'
          fi
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
