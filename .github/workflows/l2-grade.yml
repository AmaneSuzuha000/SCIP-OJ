name: L2 Grade
on:
  pull_request:
    paths:
      - "submissions/**"
permissions:
  contents: read
  pull-requests: write
jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install judge deps
        run: pip install -r requirements-judge.txt
      - name: Run L2 judges
        id: grade
        run: |
          python << 'PY'
          import json, os
          from pathlib import Path
          from judge.runner_l2 import discover, grade_file
          root = Path("submissions")
          files = discover(root)
          reports = []
          for f in files:
              # skip README-only dirs
              if f.name.startswith("_"):
                  continue
              reports.append(grade_file(f))
          Path("l2-report.json").write_text(json.dumps(reports, ensure_ascii=False, indent=2), encoding="utf-8")
          lines = ["## L2 判分结果（权威练习/作业分）", ""]
          if not reports:
              lines.append("未找到 `submissions/<user>/<PROBLEM_ID>.py`。")
          for r in reports:
              if not r.get("ok"):
                  lines.append(f"- `{r.get('path')}`: 错误 — {r.get('error')}")
                  continue
              flag = "通过" if r.get("passed") else "未通过"
              lines.append(f"- **{r.get('problem_id')}** (`{r.get('path')}`): **{r.get('score')}** · {flag}")
          Path("l2-comment.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: l2-report
          path: |
            l2-report.json
            l2-comment.md
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('l2-comment.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
