name: Course UI Chromium Preview

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "content/**"
      - "notebook/**"
      - "jupyter-lite.json"
      - "environment.yml"
      - "tests/test_unified_runtime_browser.cjs"
      - "tests/test_environment_browser.cjs"
      - "tests/test_math_browser.cjs"
      - "tests/test_navigation_browser.cjs"
      - "tests/test_teacher_browser.cjs"
      - "tests/test_interaction_browser.cjs"
      - "tests/fixtures/**"
      - "tests/test_site_access_browser.cjs"
      - "judge/ie_des01_reference.py"
      - "tests/test_ui_browser.cjs"
      - ".github/workflows/ui-visual-smoke.yml"
  pull_request:
    paths:
      - "site/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "content/**"
      - "notebook/**"
      - "jupyter-lite.json"
      - "environment.yml"
      - "tests/test_unified_runtime_browser.cjs"
      - "tests/test_environment_browser.cjs"
      - "tests/test_math_browser.cjs"
      - "tests/test_navigation_browser.cjs"
      - "tests/test_teacher_browser.cjs"
      - "tests/test_interaction_browser.cjs"
      - "tests/fixtures/**"
      - "tests/test_site_access_browser.cjs"
      - "judge/ie_des01_reference.py"
      - "tests/test_ui_browser.cjs"
      - ".github/workflows/ui-visual-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-chromium-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build portal components
        run: npm ci && npm run build
      - name: Install CJK font for readable Chinese review screenshots
        run: |
          mkdir -p "$HOME/.local/share/fonts"
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf \
            --output "$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf"
          test "$(git hash-object "$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf")" = dc15562470b4f842321894787a0d066879ccff8b
          fc-cache -f
          fc-match 'Noto Sans CJK SC' | grep -F NotoSansCJKsc-Regular
      - name: Install Playwright headless-shell
        run: |
          npx playwright install chromium --only-shell
      - uses: mamba-org/setup-micromamba@v1
        with:
          micromamba-version: "1.5.8-0"
          environment-file: .github/build-environment.yml
          cache-environment: true
      - name: Build real JupyterLite runtime
        shell: bash -l {0}
        run: jupyter lite build --contents content --output-dir lite-build
      - name: Assemble the same distribution as production
        run: python3 scripts/assemble_site.py --lite lite-build --output ui-preview
      - name: Start read-only course website preview
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory ui-preview > /tmp/scip-ui-preview.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Exercise responsive workbench, three labs, downloads and independent replay
        run: |
          node tests/test_site_access_browser.cjs
          python3 scripts/preview_ui_fixture.py --directory ui-preview --port 8766 > /tmp/scip-ui-fixture.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8766/index.html > /dev/null; then break; fi
            sleep 1
          done
          export SCIP_UI_TEST_ORIGIN=http://127.0.0.1:8766
          node tests/test_ui_browser.cjs
          node tests/test_teacher_browser.cjs
          node tests/test_interaction_browser.cjs
          node tests/test_navigation_browser.cjs
          node tests/test_environment_browser.cjs
          node tests/test_math_browser.cjs
          node tests/test_practice_browser.cjs
          node tests/test_unified_runtime_browser.cjs
      - name: Save review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scip-lab-ui-preview
          path: ui-artifacts/
          if-no-files-found: warn
          retention-days: 14
