name: Judge Regression Tests

on:
  push:
    branches: [main, 'fix/**', 'feat/**', 'security/**']
  pull_request:

permissions:
  contents: read

jobs:
  judge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python scoring and oracle isolation regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Browser scoring regressions
        run: node tests/test_browser_judge.cjs
      - name: Shared submission state and retry identity
        run: node tests/test_grading_state.cjs
      - name: Exam-mode browser regression tests
        run: node tests/test_exam_integrity.cjs
      - name: Industrial engineering simulation reproducibility tests
        run: node tests/test_simulation_core.cjs
      - name: IE-DES-01 browser evidence export and stale-state regression
        run: node tests/test_ie_des01_export.cjs
      - name: Inventory and flow CSV units and stale-evidence regressions
        run: node tests/test_teaching_lab_exports.cjs
      - name: Inventory, flow-line, Erlang-C and official examples regressions
        run: node tests/test_ie_case_extensions.cjs
      - name: Browser Python worker isolation regressions
        run: node tests/test_python_runtime.cjs
      - name: Independent course UI DOM and navigation regressions
        run: node tests/test_workbench_ui.cjs
      - name: Course and learning space routing regressions
        run: node tests/test_spaces.cjs
      - name: Check frontend JavaScript syntax
        run: |
          node --check site/js/app.js
          node --check site/js/spaces.js
          node --check site/js/simulation-core.js
          node --check site/js/inventory-core.js
          node --check site/js/flow-core.js
          node --check site/js/teaching-labs.js
          node --check site/js/case-studio.js
          node --check site/js/python_runtime.js
          node --check site/js/teacher.js
          node --check site/js/platform.js
          node --check site/js/grading-state.js
          node --check site/js/request-keys.js
          node --check site/js/editor.js
          node --check site/js/exam-integrity.js
          node --check site/js/teacher.js

  grading-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: scip_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Typecheck deployed Edge functions
        run: >-
          deno check --node-modules-dir=manual
          supabase/functions/submit-assignment/index.ts
          supabase/functions/regrade/index.ts
          supabase/functions/regrade-batch/index.ts
          supabase/functions/grade-callback/index.ts
      - name: Real PostgreSQL transactions, privileges and concurrent consumers
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/scip_test
        run: npm run test:database

  sandbox-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build isolated student image
        run: docker build --pull --file judge/Dockerfile.sandbox --tag scip-oj-student:ci .
      - name: Verify PySCIPOpt and offline Docker execution
        run: |
          docker run --rm --network none --entrypoint python scip-oj-student:ci -c 'from pyscipopt import Model; print("PySCIPOpt OK")'
          python - <<'PY'
          from pathlib import Path
          from judge.runner_l2_isolated import grade_file
          for pid, source in [
              ("P001", "problems/P001_knapsack/template.py"),
              ("P002", "problems/P002_assignment/template.py"),
          ]:
              report = grade_file(Path(source), pid, {"n_instances": 1, "pass_score": 90})
              print(pid, report["status"], report["score"], report.get("messages"))
              assert report["status"] == "done" and report["score"] == 100
              assert report["sandbox"] == "isolated_container"
              assert report["test_set"] == "server_private_v2"
          PY
      - name: Execute 4 original IE PySCIPOpt Notebooks against independent oracles
        run: |
          docker run --rm --network none -v "$PWD/content:/course:ro" --entrypoint python scip-oj-student:ci -c 'import glob,json; fs=sorted(glob.glob("/course/0[3-6]_IE_*_PySCIPOpt.ipynb")); assert len(fs)==4,fs; [(print("Checking",f),exec("\n\n".join("".join(c["source"]) for c in json.load(open(f))["cells"] if c["cell_type"]=="code"),{})) for f in fs]'
      - name: Adversarial execution regression
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from judge.runner_l2_isolated import _run_isolated, grade_file
          from judge.private_instances import private_knapsack

          inst = private_knapsack(7026)
          public = {k: v for k, v in inst.items() if k != "optimal_value"}
          with tempfile.TemporaryDirectory() as d:
              d = Path(d)
              # Host-only environment variables do not cross the container boundary.
              import os
              os.environ["SCIP_OJ_TEST_SECRET"] = "must_not_cross_boundary"
              secret_probe = d / "secret_probe.py"
              secret_probe.write_text(
                  'import os\n'
                  'def solve(instance):\n'
                  '    if os.environ.get("SCIP_OJ_TEST_SECRET"):\n'
                  '        raise RuntimeError("HOST_ENV_LEAKED")\n'
                  '    return {"objective": 0, "solution": [0] * instance["n"]}\n'
              )
              res, err = _run_isolated(secret_probe, public, 5)
              assert err is None and res["objective"] == 0, (res, err)

              # Read-only sandbox filesystem is not writable by student code.
              write_probe = d / "read_only.py"
              write_probe.write_text(
                  'def solve(instance):\n'
                  '    with open("/sandbox/worker.py", "w") as f:\n'
                  '        f.write("modified")\n'
                  '    return {}\n'
              )
              res, err = _run_isolated(write_probe, public, 5)
              assert res is None and ("PermissionError" in err or "Read-only file system" in err), (res, err)

              # Infinite loops must be interrupted and containers cleaned up.
              loop = d / "loop.py"
              loop.write_text('def solve(instance):\n    while True: pass\n')
              res, err = _run_isolated(loop, public, 2)
              assert res is None and "时间限制" in err, (res, err)
          print("Adversarial sandbox checks passed")
          PY
