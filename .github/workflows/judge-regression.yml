name: Judge Regression Tests

on:
  push:
    branches: [main, 'fix/**', 'feat/**', 'security/**']
  pull_request:

permissions:
  contents: read

jobs:
  judge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python scoring and oracle isolation regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Browser scoring regressions
        run: node tests/test_browser_judge.cjs
      - name: Exam-mode browser regression tests
        run: node tests/test_exam_integrity.cjs
      - name: Check frontend JavaScript syntax
        run: |
          node --check site/js/app.js
          node --check site/js/teacher.js
          node --check site/js/platform.js
          node --check site/js/editor.js
          node --check site/js/exam-integrity.js
          node --check site/js/teacher.js

  sandbox-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build isolated student image
        run: docker build --pull --file judge/Dockerfile.sandbox --tag scip-oj-student:ci .
      - name: Verify PySCIPOpt and offline Docker execution
        run: |
          docker run --rm --network none --entrypoint python scip-oj-student:ci -c 'from pyscipopt import Model; print("PySCIPOpt OK")'
          python - <<'PY'
          from pathlib import Path
          from judge.runner_l2_isolated import grade_file
          for pid, source in [
              ("P001", "problems/P001_knapsack/template.py"),
              ("P002", "problems/P002_assignment/template.py"),
          ]:
              report = grade_file(Path(source), pid, {"n_instances": 1, "pass_score": 90})
              print(pid, report["status"], report["score"], report.get("messages"))
              assert report["status"] == "done" and report["score"] == 100
              assert report["sandbox"] == "isolated_container"
              assert report["test_set"] == "server_private_random"
          PY
