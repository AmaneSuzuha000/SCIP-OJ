name: Grade Submission (Platform)

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: 'Submission UUID from platform database'
        required: true
        type: string
      grading_id:
        description: 'Unique grading attempt UUID'
        required: true
        type: string
      problem_id:
        description: 'Problem ID (e.g. P001)'
        required: false
        type: string
      callback_url:
        description: 'Grade callback URL'
        required: false
        type: string

permissions:
  contents: read

# One run per grading attempt. A duplicate delivery is already rejected by the
# idempotent claim, but serialising here avoids paying for two whole runners.
concurrency:
  group: grade-${{ inputs.grading_id }}
  cancel-in-progress: false

env:
  # Containers are independent and startup dominates; three keeps wall time
  # down on a two-core runner without oversubscribing memory.
  SCIP_OJ_INSTANCE_PARALLELISM: '3'

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve trusted transport
        run: cp scripts/grading_transport.py "$RUNNER_TEMP/grading_transport.py"
      - name: Claim the exact queued grading
        id: claim
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
          GRADING_ID: ${{ inputs.grading_id }}
        run: python "$RUNNER_TEMP/grading_transport.py" claim
      - name: Check out the frozen scorer and problem definitions
        if: steps.claim.outputs.claimed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.claim.outputs.grader_ref }}
          clean: false
      - name: Set up Buildx
        if: steps.claim.outputs.claimed == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Build isolated student-execution image
        if: steps.claim.outputs.claimed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: judge/Dockerfile.sandbox
          tags: scip-oj-student:ci
          load: true
          pull: true
          # Reuse the PySCIPOpt layer across runs instead of re-resolving it
          # every time; the Dockerfile itself is the cache key.
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox
      - name: Verify the sandbox image
        if: steps.claim.outputs.claimed == 'true'
        run: |
          docker run --rm --network none --entrypoint python scip-oj-student:ci \
            -c 'from pyscipopt import Model; print("SCIP image ready")'
          docker image inspect scip-oj-student:ci --format 'Sandbox image ID: {{.Id}}'
      - name: Run frozen judge
        if: steps.claim.outputs.claimed == 'true'
        run: python -m scripts.run_formal_grade
      - name: Post grade callback
        if: always() && steps.claim.outputs.claimed == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          GRADE_CALLBACK_SECRET: ${{ secrets.GRADE_CALLBACK_SECRET }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
          GRADING_ID: ${{ inputs.grading_id }}
        run: python "$RUNNER_TEMP/grading_transport.py" callback
      - uses: actions/upload-artifact@v4
        if: always() && steps.claim.outputs.claimed == 'true'
        with:
          name: grading-report-${{ inputs.grading_id }}-${{ github.run_attempt }}
          path: _grading_tmp/report.json
      - name: Remove private execution inputs
        if: always()
        run: rm -rf _grading_tmp
